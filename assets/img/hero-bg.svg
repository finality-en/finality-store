<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset=".55" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#12305a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3d6b"/><stop offset="1" stop-color="#0f2443"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163257"/><stop offset="1" stop-color="#0b1a31"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f38"/><stop offset="1" stop-color="#070e1c"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff" stop-opacity=".9"/><stop offset=".25" stop-color="#bfe6ff" stop-opacity=".25"/><stop offset="1" stop-color="#5cd3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1600" height="560" fill="url(#sky)"/>
  <!-- aurora -->
  <g filter="url(#blur)" opacity=".55">
    <path d="M-50 190 C 250 90, 520 210, 820 120 S 1350 60, 1650 150 L1650 230 C 1350 150, 1100 260, 820 200 S 300 190, -50 280 Z" fill="#2fd6b5"/>
    <path d="M-50 150 C 300 60, 600 170, 900 90 S 1400 40, 1650 110 L1650 160 C 1350 110, 1150 190, 900 150 S 350 140, -50 210 Z" fill="#5cd3ff"/>
    <path d="M200 120 C 500 40, 800 120, 1100 60 S 1500 30, 1650 70 L1650 100 C 1450 80, 1250 140, 1050 110 S 600 110, 200 170 Z" fill="#8a7dff" opacity=".7"/>
  </g>
  <!-- stars -->
  <g fill="#eaf6ff">
    <circle cx="90" cy="60" r="1.4" opacity=".8"/><circle cx="210" cy="130" r="1" opacity=".6"/><circle cx="330" cy="40" r="1.6" opacity=".9"/><circle cx="470" cy="95" r="1.1" opacity=".6"/>
    <circle cx="610" cy="30" r="1.3" opacity=".8"/><circle cx="760" cy="70" r="1" opacity=".5"/><circle cx="880" cy="25" r="1.5" opacity=".8"/><circle cx="1010" cy="110" r="1.1" opacity=".6"/>
    <circle cx="1130" cy="45" r="1.4" opacity=".9"/><circle cx="1260" cy="90" r="1" opacity=".6"/><circle cx="1380" cy="35" r="1.6" opacity=".8"/><circle cx="1510" cy="80" r="1.2" opacity=".7"/>
    <circle cx="150" cy="200" r="1" opacity=".4"/><circle cx="560" cy="170" r="1.2" opacity=".5"/><circle cx="1080" cy="190" r="1" opacity=".4"/><circle cx="1450" cy="170" r="1.1" opacity=".5"/>
  </g>
  <circle cx="1290" cy="120" r="140" fill="url(#moon)"/>
  <circle cx="1290" cy="120" r="34" fill="#eaf6ff" opacity=".85"/>
  <!-- far mountains -->
  <path d="M0 400 L120 300 L210 350 L340 230 L470 340 L560 290 L690 360 L800 250 L930 340 L1040 280 L1160 350 L1290 240 L1420 330 L1520 280 L1600 320 L1600 560 L0 560 Z" fill="url(#far)"/>
  <path d="M340 230 L380 262 L360 258 L340 270 L318 256 L300 262 Z M800 250 L842 282 L820 278 L800 292 L778 278 L758 284 Z M1290 240 L1334 274 L1310 270 L1290 284 L1268 270 L1246 276 Z" fill="#cfe8ff" opacity=".55"/>
  <!-- mid hills -->
  <path d="M0 450 C 160 390, 300 420, 430 380 S 700 410, 860 370 S 1150 400, 1300 360 S 1500 400, 1600 380 L1600 560 L0 560 Z" fill="url(#mid)"/>
  <path d="M0 450 C 160 390, 300 420, 430 380 S 700 410, 860 370 S 1150 400, 1300 360 S 1500 400, 1600 380 L1600 392 C 1500 412, 1400 376, 1300 372 S 1150 412, 860 382 S 700 422, 430 392 S 160 402, 0 462 Z" fill="#d9edff" opacity=".22"/>
  <!-- pines -->
  <g fill="#081426">
    <path d="M60 470 l26 -70 l26 70 z M72 440 l14 -52 l14 52 z"/><path d="M140 480 l20 -56 l20 56 z"/><path d="M1460 470 l26 -72 l26 72 z M1472 438 l14 -50 l14 50 z"/><path d="M1540 482 l20 -58 l20 58 z"/>
    <path d="M300 488 l16 -44 l16 44 z"/><path d="M1300 486 l18 -48 l18 48 z"/>
  </g>
  <!-- near snow ground -->
  <path d="M0 500 C 220 470, 420 495, 640 482 S 1040 470, 1240 488 S 1480 478, 1600 486 L1600 560 L0 560 Z" fill="url(#near)"/>
  <path d="M0 500 C 220 470, 420 495, 640 482 S 1040 470, 1240 488 S 1480 478, 1600 486 L1600 494 C 1480 486, 1360 498, 1240 496 S 1040 478, 640 490 S 220 478, 0 508 Z" fill="#9fc9ff" opacity=".18"/>
</svg>
